services:
  # ============================================================================
  # 1. BANCO DE DADOS: PostgreSQL 16 (Zero-Config com init.sql automático)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: purchasing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: compras
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d compras"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purchasing_network

  # ============================================================================
  # 2. SERVIDOR MCP: Ferramentas DummyJSON + Gravação no Postgres
  # ============================================================================
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: purchasing_mcp_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-compras}
      DUMMYJSON_BASE_URL: https://dummyjson.com
      HTTP_TIMEOUT: "15.0"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purchasing_network

  # ============================================================================
  # 3. BACKEND: Python FastAPI + OpenRouter LLM Orchestrator
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purchasing_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-compras}
      MCP_SERVER_URL: http://mcp-server:8001
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o}
      BACKEND_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purchasing_network

  # ============================================================================
  # 4. FRONTEND: Interface de Chat React + Nginx Reverse Proxy (Zero-CORS)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: purchasing_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - purchasing_network

volumes:
  pgdata:
    driver: local

networks:
  purchasing_network:
    driver: bridge
